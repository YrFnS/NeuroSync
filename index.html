<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>NeuroSync</title>
    <meta name="description" content="AI-powered accessibility interface" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom Fonts & Base Styles */
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;800&display=swap');

      :root {
        --neon-green: #00FF94;
        --alert-red: #FF2E2E;
        --deep-black: #050505;
        --scan-blue: #2E94FF;
      }

      body {
        background-color: var(--deep-black);
        color: white;
        font-family: 'Inter', sans-serif;
        overscroll-behavior: none;
      }

      .font-mono {
        font-family: 'Space Mono', monospace;
      }

      /* Utilities for high contrast & liquid UI */
      .liquid-transition {
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .scan-line {
        position: absolute;
        width: 100%;
        height: 4px;
        background: var(--scan-blue);
        box-shadow: 0 0 15px var(--scan-blue);
        animation: scan 2s linear infinite;
      }

      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      .pulse-ring {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(0, 255, 148, 0.7); }
        70% { transform: scale(1.1); opacity: 0; box-shadow: 0 0 0 20px rgba(0, 255, 148, 0); }
        100% { transform: scale(0.8); opacity: 0; }
      }

      /* Hide scrollbar for immersive feel */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
