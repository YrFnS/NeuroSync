<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>NeuroSync</title>
    <meta name="description" content="AI-powered accessibility interface" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <style>
      /* ACCESSIBILITY FONT: Atkinson Hyperlegible (Braille Institute) */
      @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap');

      :root {
        --safety-yellow: #FFD600;
        --signal-orange: #FF4D00;
        --void-black: #000000;
        --pure-white: #FFFFFF;
        --cobalt-blue: #0047AB;
      }

      body {
        background-color: var(--void-black);
        color: var(--pure-white);
        font-family: 'Atkinson Hyperlegible', sans-serif;
        overscroll-behavior: none;
        overflow: hidden; /* Prevent scroll */
      }

      /* Utilities for High Contrast UI */
      .liquid-transition {
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Solid, bold borders for low vision visibility */
      .hc-border {
        border: 4px solid var(--pure-white);
      }

      .pulse-heavy {
        animation: pulse-heavy 1.5s ease-in-out infinite;
      }

      @keyframes pulse-heavy {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }

      /* Flash effect for danger */
      .flash-danger {
        animation: flash-red 0.5s linear infinite;
      }

      @keyframes flash-red {
        0%, 100% { background-color: var(--signal-orange); color: black; }
        50% { background-color: black; color: var(--signal-orange); }
      }

      /* Leaflet Customization for High Contrast */
      .leaflet-container {
        background: #000;
        font-family: 'Atkinson Hyperlegible', sans-serif;
      }
      .leaflet-popup-content-wrapper {
        background: #000;
        color: var(--safety-yellow);
        border: 2px solid var(--safety-yellow);
        border-radius: 4px;
        font-weight: bold;
      }
      .leaflet-popup-tip {
        background: var(--safety-yellow);
      }
    </style>
